<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14100c">
<title>재의 미궁</title>
<style>
html { background: #14100c; color: #efe6d2; }
body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
main { max-width: 22rem; padding: 2rem 1.5rem; }
h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 1rem; }
p { color: #a89a82; line-height: 1.6; margin: 0 0 1rem; }
button { margin-top: 1rem; width: 100%; padding: 0.9rem; font: inherit; font-size: 1.05rem; color: #efe6d2; background: #2a221a; border: 1px solid #d4a85a; border-radius: 10px; }
button:focus-visible { outline: 2px solid #efe6d2; outline-offset: 3px; }
</style>
</head>
<body>
<main>
<h1>인터넷 연결이 필요합니다</h1>
<p>처음에는 인터넷에 연결된 상태에서 게임을 한 번 받아야 합니다. 한 번 받고 나면 그다음부터는 연결 없이도 열립니다.</p>
<p>연결을 확인한 뒤 다시 시도해 주세요.</p>
<button type="button" onclick="window.location.reload()">다시 시도</button>
</main>
</body>
</html>
